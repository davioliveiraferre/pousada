  <body>
    <header>
      <nav>
        <a href="index.html">Home</a>
        <a href="galeria.html">Acomodações</a>
        <a href="">Experiencias</a>
        <a href="">Galeria</a>

        <a class="especialreserva" href="">Reservar agora</a>

      <section class="reserva">
        <h1>Faça sua reserva</h1>

        <form>
          <label for="entrada">Entrada</label>
          <input type="date" id="entrada" />

          <label for="saida">Saída</label>
          <input type="date" id="saida" />

          <label for="quarto">Quarto</label>
          <select id="quarto">
            <option value="">Selecione o quarto</option>
            <option>Suíte Romântica</option>
            <option>Chalé da Serra</option>
            <option>Chalé Premium</option>
            <option>Quarto Aconchegante</option>
            <option>Refúgio com Piscina</option>
            <option>Experiência Natureza</option>
            <option>Refúgio Família</option>
            <option>Experiência Premium</option>
          </select>

          <label for="hospedes">Número de hóspedes</label>
          <input type="number" id="hospedes" min="1" placeholder="Ex: 2" />

          <button type="submit">Reservar</button>
        </form>
      </section>
    </header>
  </body>
